<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor Cloud</title>
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monitor Cloud">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b0f14'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='%232f9e6e'>M</text></svg>">
<link rel="manifest" href="./manifest.webmanifest">
<style>
body{margin:0;background:#0b0f14;color:#e8eef5;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}
.card{max-width:380px;padding:32px 24px;border:1px solid #223041;border-radius:16px;background:#121922;margin:16px}
.logo{width:64px;height:64px;border-radius:16px;background:#0b0f14;border:1px solid #223041;display:grid;place-items:center;font-size:36px;color:#2f9e6e;margin:0 auto 12px;font-weight:700}
h1{font-size:20px;margin:8px 0} p{color:#93a3b5;font-size:14px}
.btn{display:block;background:#2f9e6e;color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:10px;margin:16px 0 8px}
.btn.ghost{background:transparent;border:1px solid #223041;color:#e8eef5}
small{color:#5b6b7d;font-size:12px}
</style>
</head>
<body>
<main class="card">
<div class="logo">M</div>
<h1>Monitor Cloud</h1>
<p>Para instalar como app no celular:<br>iPhone: Compartilhar &gt; Adicionar à Tela de Início<br>Android: ⋮ &gt; Adicionar à tela inicial</p>
<a class="btn" href="https://hellocode.com.br/portal/cloud">Abrir monitor</a>
<button class="btn ghost" id="btnInstall" hidden>Instalar app</button>
<p><small>hellocode.com.br/portal/cloud</small></p>
</main>
<script>
let d=null;const b=document.getElementById('btnInstall');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();d=e;b.hidden=false;});
b.onclick=async()=>{if(!d)return;d.prompt();await d.userChoice;d=null;b.hidden=true;};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
